spring:
  application:
    name: yaquedo-services
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/yaquedo}
    username: ${DB_USER:yaquedo}
    password: ${DB_PASSWORD:yaquedo_local_pwd}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: ${SHOW_SQL:false}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 20MB

server:
  port: 8080
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

yaquedo:
  jwt:
    secret: ${JWT_SECRET:please-change-this-secret-please-change-this-secret-please}
    expiration-seconds: 3600
  otp:
    ttl-minutes: 5
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    bucket: ${S3_BUCKET:yaquedo-uploads}

logging:
  level:
    com.tetradev.yaquedo: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
