name: Deploy Landing to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # Inyecta las API keys desde GitHub Secrets en un archivo local
      # ai-config.local.js (que está en .gitignore, no existe en el repo).
      # El index.html carga este archivo antes de ai-assistant.js, lo cual
      # define window.YQ_GROQ_API_KEY y el chatbot lo lee al iniciar.
      # ----------------------------------------------------------------------
      - name: Inject AI config from repository secret
        run: |
          cat > ai-config.local.js << EOF
          // Generated by GitHub Actions on $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          // DO NOT EDIT MANUALLY · DO NOT COMMIT
          window.YQ_AI_PROVIDER = 'groq';
          window.YQ_GROQ_API_KEY = '${{ secrets.GROQ_API_KEY }}';
          EOF
          echo "ai-config.local.js generated ($(wc -c < ai-config.local.js) bytes)"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
